<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Badala BSB 6.0 - Spelling Bee</title>
    <style>
        :root {
            --primary-color: #1b4332;
            --secondary-color: #2d6a4f;
            --accent-color: #d4af37;
            --bg-color: #f4f7f6;
            --text-color: #212529;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            padding: 24px;
            text-align: center;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header p {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
            background-color: var(--secondary-color);
        }

        .btn-accent {
            background-color: var(--accent-color);
            color: #000;
        }

        .hidden {
            display: none !important;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            background: #e9ecef;
            color: #495057;
            margin-bottom: 16px;
        }
    </style>
    <script src="papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Application Root Container -->
        <div id="app-header" class="header">
            <h1>Badala BSB 6.0</h1>
            <p>2026 Bauchi Spelling Bee Practice</p>
        </div>
        <div id="status" class="status-badge">Initializing local audio database...</div>
<!-- Home / Main Menu View -->
        <div id="home-view">
            <div class="category-grid">
                <button class="btn" onclick="app.showCategorySelection('jss')">Junior Secondary (JSS)</button>
                <button class="btn" onclick="app.showCategorySelection('sss')">Senior Secondary (SSS)</button>
                <button class="btn btn-accent" onclick="app.startPractice('all')">Quick Practice (All Words)</button>
            </div>
        </div>

        <!-- Category Selection View (Dynamic Sub-categories) -->
        <div id="category-view" class="hidden">
            <div id="sub-category-list" class="category-grid">
                <!-- Populated dynamically via JS -->
            </div>
            <button class="btn" style="background-color: #6c757d; margin-top: 10px;" onclick="app.showHome()">Back to Home</button>
        </div>

        <!-- Quiz / Game Play View -->
        <div id="quiz-view" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <span id="progress-indicator" style="font-size: 0.85rem; font-weight: 600; color: #495057;">Word 1 of 50</span>
                <span id="score-indicator" style="font-size: 0.85rem; font-weight: 600; color: var(--primary-color);">Score: 0</span>
            </div>

            <div style="background: #f8f9fa; border-radius: 12px; padding: 20px; margin-bottom: 20px;">
                <button class="btn btn-accent" onclick="app.playCurrentAudio()" style="margin-bottom: 12px;">🔊 Listen to Pronunciation</button>
                <p id="definition-hint" style="font-size: 0.9rem; color: #6c757d; font-style: italic; min-height: 40px; display: flex; align-items: center; justify-content: center;">Loading hint...</p>
            </div>

            <div style="margin-bottom: 16px;">
                <input type="text" id="user-spelling" placeholder="Type your spelling here..." autocomplete="off" autocapitalize="none" style="width: 100%; padding: 14px; font-size: 1.1rem; border: 2px solid #ced4da; border-radius: 10px; text-align: center; outline: none;">
            </div>

            <button class="btn" onclick="app.submitAnswer()">Submit Spelling</button>
            <button class="btn" style="background-color: #6c757d; margin-top: 10px;" onclick="app.showHome()">Quit to Menu</button>
        </div>

        <!-- Result / Summary View -->
        <div id="result-view" class="hidden">
            <h2 style="color: var(--primary-color); margin-bottom: 12px;">Practice Complete!</h2>
            <p id="final-score-text" style="font-size: 1.1rem; margin-bottom: 20px; font-weight: 600;">You scored 0 out of 0</p>
            <button class="btn" onclick="app.showHome()">Return to Home</button>
        </div>
    </div>
<script>
        class SpellingBeeApp {
            constructor() {
                this.wordsData = [];
                this.currentCategoryWords = [];
                this.currentIndex = 0;
                this.score = 0;
                this.currentAudio = null;
                this.init();
            }

            async init() {
                const statusEl = document.getElementById('status');
                try {
                    // Safe fetch approach for Android WebView (avoids CORS/file block)
                    const response = await fetch('./words.csv');
                    const csvText = await response.text();
                    
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: (results) => {
                            this.wordsData = results.data;
                            statusEl.textContent = `Ready: ${this.wordsData.length} words loaded offline`;
                            statusEl.style.background = '#d4edda';
                            statusEl.style.color = '#155724';
                        },
                        error: (err) => {
                            console.error('PapaParse error:', err);
                            statusEl.textContent = 'Error parsing word bank.';
                        }
                    });
                } catch (e) {
                    console.error('Fetch error:', e);
                    statusEl.textContent = 'Offline database ready (Fallback mode)';
                }
            }

            showHome() {
                this.hideAllViews();
                document.getElementById('home-view').classList.remove('hidden');
                document.getElementById('app-header').classList.remove('hidden');
            }

            showCategorySelection(type) {
                this.hideAllViews();
                const container = document.getElementById('sub-category-list');
                container.innerHTML = '';
                
                // Filter categories dynamically based on JSS or SSS
                const filtered = this.wordsData.filter(w => w.category && w.category.toLowerCase().includes(type));
                const uniqueSubCats = [...new Set(filtered.map(w => w.subcategory || 'General'))];

                uniqueSubCats.forEach(subCat => {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.textContent = subCat.toUpperCase();
                    btn.onclick = () => this.startPractice(subCat);
                    container.appendChild(btn);
                });

                document.getElementById('category-view').classList.remove('hidden');
            }

            startPractice(categoryFilter) {
                if (categoryFilter === 'all') {
                    this.currentCategoryWords = [...this.wordsData];
                } else {
                    this.currentCategoryWords = this.wordsData.filter(w => 
                        (w.subcategory && w.subcategory.toLowerCase() === categoryFilter.toLowerCase()) ||
                        (w.category && w.category.toLowerCase().includes(categoryFilter.toLowerCase()))
                    );
                }

                if (this.currentCategoryWords.length === 0) {
                    // Fallback dataset if CSV hasn't fully registered or empty filter
                    this.currentCategoryWords = [
                        { word: 'accommodation', definition: 'A room, group of rooms, or building in which someone may live or stay.', audio: 'accommodation.mp3' },
                        { word: 'millennium', definition: 'A period of a thousand years.', audio: 'millennium.mp3' }
                    ];
                }

                // Shuffle words for practice
                this.currentCategoryWords.sort(() => Math.random() - 0.5);
                this.currentIndex = 0;
                this.score = 0;

                this.hideAllViews();
                document.getElementById('quiz-view').classList.remove('hidden');
                this.loadCurrentQuestion();
            }

            loadCurrentQuestion() {
                const currentItem = this.currentCategoryWords[this.currentIndex];
                document.getElementById('progress-indicator.textContent` = `Word ${this.currentIndex + 1} of ${this.currentCategoryWords.length}`);
                
                // Fix: Safely reference property names regardless of CSV casing
                const def = currentItem.definition || currentItem.Meaning || 'Listen to the audio pronunciation carefully.';
                document.getElementById('definition-hint').textContent = `Hint/Meaning: ${def}`;
                document.getElementById('user-spelling.value = '';
                
                this.playCurrentAudio();
            }

            playCurrentAudio() {
                const currentItem = this.currentCategoryWords[this.currentIndex];
                const wordClean = (currentItem.word || currentItem.Word || '').trim().toLowerCase();
                
                if (this.currentAudio) {
                    this.currentAudio.pause();
                }

                // Native relative audio path safe for Android assets
                this.currentAudio = new Audio(`./audio_files/${wordClean}.mp3`);
                this.currentAudio.play().catch(err => {
                    console.log('Audio playback constraint or missing file:', err);
                });
            }
submitAnswer() {
                const currentItem = this.currentCategoryWords[this.currentIndex];
                const targetWord = (currentItem.word || currentItem.Word || '').trim().toLowerCase();
                const userGuess = document.getElementById('user-spelling').value.trim().toLowerCase();

                if (userGuess === targetWord) {
                    this.score++;
                    alert('Correct! 🎉');
                } else {
                    alert(`Incorrect. The correct spelling is: ${targetWord}`);
                }

                document.getElementById('score-indicator').textContent = `Score: ${this.score}`;

                this.currentIndex++;
                if (this.currentIndex < this.currentCategoryWords.length) {
                    this.loadCurrentQuestion();
                } else {
                    this.showResults();
                }
            }

            showResults() {
                this.hideAllViews();
                document.getElementById('result-view').classList.remove('hidden');
                document.getElementById('final-score-text').textContent = 
                    `You scored ${this.score} out of ${this.currentCategoryWords.length}`;
            }

            hideAllViews() {
                document.getElementById('app-header').classList.add('hidden');
                document.getElementById('home-view').classList.add('hidden');
                document.getElementById('category-view').classList.add('hidden');
                document.getElementById('quiz-view').classList.add('hidden');
                document.getElementById('result-view').classList.add('hidden');
            }
        }

        // Initialize Global App Instance on Load
        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new SpellingBeeApp();
        });
    </script>
</body>
</html>
