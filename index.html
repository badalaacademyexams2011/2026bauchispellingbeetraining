<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Bauchi Spelling Bee Training</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --accent: #10b981;
            --bg-gradient: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-dark: #0f172a;
            --text-muted: #475569;
        }

        * {
            box-sizing: border-box;
            transition: all 0.25s ease;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .logo-header {
            margin-bottom: 20px;
        }

        .app-logo {
            max-width: 130px;
            height: auto;
            object-fit: contain;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        h1 {
            color: var(--primary);
            margin: 5px 0 8px 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-dark);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.05rem;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(5, 150, 105, 0.4);
        }

        .hidden { display: none !important; }

        .score-box {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin: 20px 0;
            padding: 15px;
            background: rgba(5, 150, 105, 0.08);
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="glass-card">
    <!-- Header Logo & Title -->
    <div class="logo-header">
        <img src="icon.png" alt="Badala-BSB Logo" class="app-logo" onerror="this.style.display='none'">
        <h1>Spelling Bee</h1>
        <p class="subtitle">2026 Bauchi Spelling Bee Training</p>
    </div>

    <!-- Screen 1: Registration & Category Selection -->
    <div id="setup-screen">
        <div class="form-group">
            <label for="student-name">Full Name</label>
            <input type="text" id="student-name" placeholder="e.g. Ayinde Fuad">
        </div>

        <div class="form-group">
            <label for="student-class">Class / Arm</label>
            <input type="text" id="student-class" placeholder="e.g. JSS 2B">
        </div>

        <div class="form-group">
            <label for="category-select">Category</label>
            <select id="category-select">
                <option value="Primary">Primary</option>
                <option value="Junior Secondary">Junior Secondary</option>
                <option value="Senior Secondary">Senior Secondary</option>
            </select>
        </div>

        <div class="form-group">
            <label for="round-select">Select Round</label>
            <select id="round-select">
                <option value="1">Round 1: Standard Spelling</option>
                <option value="2">Round 2: Definition Spelling</option>
            </select>
        </div>

        <button class="btn-primary" onclick="startQuiz()">Start Competition</button>
    </div>

    <!-- Screen 2: Quiz Gameplay -->
    <div id="quiz-screen" class="hidden">
        <h2 id="round-title" style="color: var(--primary); margin-top: 0;">Round</h2>
        <p id="progress-indicator" style="color: var(--text-muted); font-weight: 600; font-size: 0.9rem;"></p>
        
        <div id="question-container" style="margin: 25px 0; text-align: left;"></div>

        <div class="form-group">
            <input type="text" id="user-answer" placeholder="Type your spelling here..." autocomplete="off">
        </div>
        <button class="btn-primary" onclick="submitAnswer()">Submit Answer</button>
    </div>

    <!-- Screen 3: Results Screen -->
    <div id="result-screen" class="hidden">
        <h1 style="color: var(--primary);">Competition Complete!</h1>
        <p class="subtitle">Great job, <strong id="res-name" style="color: var(--text-dark);"></strong>!</p>
        <div class="score-box" id="final-score-text">Score: 0 / 0</div>
        <button class="btn-primary" onclick="location.reload()">Finish & Exit</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyh84XsNiYMtTDTcf9i4EhHu1Jsh4H7VAjh40hc8H3Dt9qVn8nh9Ja2oD96kXAVedFNxA/exec";
    
    let state = {
        name: "",
        classArm: "",
        category: "",
        round: "",
        words: [],
        currentIndex: 0,
        score: 0
    };

    async function startQuiz() {
        state.name = document.getElementById("student-name").value.trim();
        state.classArm = document.getElementById("student-class").value.trim();
        state.category = document.getElementById("category-select").value;
        state.round = document.getElementById("round-select").value;

        if (!state.name || !state.classArm) {
            alert("Please enter your name and class.");
            return;
        }

        const action = state.round === "1" ? "getRound1" : "getRound2";
        const btn = document.querySelector("#setup-screen .btn-primary");
        btn.innerText = "Loading words...";

        try {
            const response = await fetch(`${SCRIPT_URL}?action=${action}&category=${encodeURIComponent(state.category)}`);
            const json = await response.json();
            
            if (json.status === "success" && json.data.length > 0) {
                state.words = json.data;
                document.getElementById("setup-screen").classList.add("hidden");
                document.getElementById("quiz-screen").classList.remove("hidden");
                document.getElementById("round-title").innerText = `Round ${state.round} (${state.category})`;
                loadQuestion();
            } else {
                alert("No words found for this category yet. Please check your Google Sheet.");
                btn.innerText = "Start Competition";
            }
        } catch (err) {
            console.error(err);
            alert("Failed to connect to database. Please check your internet connection.");
            btn.innerText = "Start Competition";
        }
    }

    function loadQuestion() {
        if (state.currentIndex >= state.words.length) {
            finishQuiz();
            return;
        }

        document.getElementById("progress-indicator").innerText = `Question ${state.currentIndex + 1} of ${state.words.length}`;
        const qContainer = document.getElementById("question-container");
        const currentWordObj = state.words[state.currentIndex];
        
        qContainer.innerHTML = "";
        document.getElementById("user-answer").value = "";

        if (state.round === "1") {
            qContainer.innerHTML = `
                <p><strong>Context / Usage:</strong></p>
                <p style="background: rgba(5, 150, 105, 0.08); padding: 12px; border-radius: 10px; font-style: italic; border-left: 4px solid var(--primary);">
                    "${currentWordObj["Audio URL / Sentence Context"] || "No sentence context provided."}"
                </p>
                <button class="btn-primary" style="background: #0284c7; margin-top: 8px;" onclick="speakWord('${currentWordObj["Word"]}')">🔊 Hear Pronunciation</button>
            `;
            speakWord(currentWordObj["Word"]);
        } else {
            qContainer.innerHTML = `
                <p><strong>Definition:</strong></p>
                <p style="background: rgba(5, 150, 105, 0.08); padding: 14px; border-radius: 10px; font-size: 1.05rem; font-weight: 500; border-left: 4px solid var(--primary);">
                    "${currentWordObj["Correct Definition"]}"
                </p>
            `;
        }
    }

    function speakWord(word) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    async function submitAnswer() {
        const userAnswer = document.getElementById("user-answer").value.trim().toLowerCase();
        const currentWordObj = state.words[state.currentIndex];
        const correctWord = (state.round === "1" ? currentWordObj["Word"] : currentWordObj["Target Word"]).trim().toLowerCase();

        if (!userAnswer) {
            alert("Please type an answer.");
            return;
        }

        if (userAnswer === correctWord) {
            state.score++;
        }

        state.currentIndex++;
        loadQuestion();
    }

    async function finishQuiz() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("res-name").innerText = state.name;
        document.getElementById("final-score-text").innerText = `Score: ${state.score} / ${state.words.length}`;

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    studentName: state.name,
                    studentClass: state.classArm,
                    category: state.category,
                    round: `Round ${state.round}`,
                    score: state.score,
                    total: state.words.length
                })
            });
        } catch (err) {
            console.error("Error saving score:", err);
        }
    }
</script>
</body>
</html>
